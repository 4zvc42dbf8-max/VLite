name: Collecte VLite
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
  push:
    paths: ["channels.json", "collect.py"]
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collecter
        run: python collect.py
      - name: Publier
        run: |
          git config user.name "vlite-bot"
          git config user.email "vlite-bot@users.noreply.github.com"
          ls -la videos.json state.json || true
          git add -f videos.json state.json || true
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git commit -m "Collecte"
          git pull --rebase --autostash || true
          git push
